<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Invalid Reset Link | SunByte Quiz</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;

        background: linear-gradient(
            135deg,
            #117373 0%,
            #155e75 45%,
            #003467 100%
        );
    }

    .container {
        width: 100%;
        max-width: 430px;
    }

    .card {
        background: rgba(255, 255, 255, 0.97);
        border-radius: 22px;
        padding: 38px 28px;
        text-align: center;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
        font-size: 34px;
        font-weight: 800;
        color: #117373;
        margin-bottom: 25px;

        text-shadow:
            rgba(0,0,0,.16) 0 3px 6px,
            rgba(0,0,0,.23) 0 3px 6px;
    }

    .icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: #fff3cd;
        color: #856404;

        font-size: 34px;
        font-weight: bold;
    }

    h2 {
        color: #222;
        font-size: 25px;
        margin-bottom: 14px;
    }

    .description {
        color: #666;
        font-size: 14px;
        line-height: 1.7;
        margin-bottom: 25px;
    }

    .reset-btn {
        display: inline-block;

        padding: 13px 25px;

        background: #FFC300;
        color: #111;

        border-radius: 10px;
        text-decoration: none;

        font-size: 15px;
        font-weight: 700;

        box-shadow:
            rgba(0,0,0,.16) 0 3px 6px,
            rgba(0,0,0,.23) 0 3px 6px;

        transition: 0.25s ease;
    }

    .reset-btn:hover {
        transform: translateY(-2px);
        background: #ffca18;
    }

    .back-login {
        display: block;
        margin-top: 20px;

        color: #003467;
        text-decoration: none;

        font-size: 14px;
        font-weight: 600;
    }

    .back-login:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {

        body {
            padding: 15px;
        }

        .card {
            padding: 32px 20px;
            border-radius: 18px;
        }

        .logo {
            font-size: 30px;
        }

        h2 {
            font-size: 22px;
        }

        .description {
            font-size: 13px;
        }
    }
</style>


</head>

<body>

<div class="container">


<div class="card">

    <div class="logo">
        SunByte Quiz
    </div>

    <div class="icon">
        !
    </div>

    <h2>
        Invalid Reset Link
    </h2>

    <p class="description">
        This password reset link is invalid or has expired.
        Please request a new password reset link to continue.
    </p>

    <a
        href="{% url 'quizapp:forgot_password' %}"
        class="reset-btn"
    >
        Request New Reset Link
    </a>

    <a
        href="{% url 'quizapp:login' %}"
        class="back-login"
    >
        ← Back to Login
    </a>

</div>


</div>

</body>
</html>
