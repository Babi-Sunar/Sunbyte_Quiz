{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Quiz Session | SunByte Quiz</title>

    <link rel="stylesheet" href="{% static 'quizapp/css/create_session.css' %}">

</head>

<body>

    <div class="container">

        <h1>Create Quiz Session</h1>
        {% if form.errors %}
        <div style="color:red;">
            {{ form.errors }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <!-- Quiz Title -->
            <label>Quiz Title</label>

            <input type="text" name="title" placeholder="Enter Quiz Title" required>

            <!-- Category -->
            <label>Category</label>

            <select name="category" id="categorySelect" class="form-input">

                <option value="">Select Category</option>

                {% for category in categories %}
                <option value="{{ category.id }}">
                    {{ category.name }}
                </option>
                {% endfor %}

                <option value="__add_category__">
                    ➕ Add New Category
                </option>

            </select>

            <div id="newCategoryBox" style="display: none; margin-top: 10px;">

                <input type="text" id="newCategoryName" class="form-input" placeholder="Enter new category name"
                    maxlength="100">
                <br><br>
                <button type="button" id="addCategoryBtn" class="btn" style="
        background: #FFC300;
        color: #111;
        border: none;
        border-radius: 9px;
        padding: 11px 18px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: 0.2s ease;
        margin-right: 5px;
    ">
                    Add Category
                </button>

                <button type="button" id="cancelCategoryBtn" class="btn" style="
        background: transparent;
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 9px;
        padding: 11px 18px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: 0.2s ease;
        margin-left: 5px;
    ">
                    Cancel
                </button>

                <p id="categoryMessage" style="color:red;"></p>

            </div>
            <!-- Timer Mode -->
            <label>Timer Mode</label>

            <select name="timer_mode">

                <option value="none">No Timer</option>

                <option value="per_quiz" selected>
                    Whole Quiz
                </option>

                <option value="per_question">
                    Per Question
                </option>

            </select>

            <!-- Total Time -->

            <label>Total Time (Minutes)</label>

            <input type="number" name="total_time_minutes" value="30" min="1" step="1">

            <!-- default time per question  -->
            <label>Default Time Per Question (Seconds)</label>

            <input type="number" name="default_time_per_question_seconds" value="60" min="5">
            <!-- Marks Mode -->

            <label>Marks Mode</label>

            <select name="marks_mode">

                <option value="uniform" selected>
                    Uniform
                </option>

                <option value="per_question">
                    Per Question
                </option>

            </select>

            <!-- Default Marks -->

            <label>Default Marks</label>

            <input type="number" name="default_marks" value="1" min="1">

            <!-- Negative Marking -->

            <div class="checkbox">

                <input type="checkbox" name="negative_marking" id="negative_marking">

                <label for="negative_marking" style="color: #ffc300;">
                    Enable Negative Marking
                </label>

            </div>

            <!-- Negative Marks -->

            <label>Negative Marks</label>

            <input type="number" name="negative_marks" value="0" min="0" step="0.25">

            <!-- Shuffle -->

            <div class="checkbox">

                <input type="checkbox" name="shuffle_questions" id="shuffle_questions">

                <label for="shuffle_questions" style="color: #ffc300;">

                    Shuffle Questions

                </label>

            </div>
            <br><br>
            <div style="display: flex; justify-content: center;">
                <button type="submit" id="create-btn">

                    Create Session

                </button>
            </div>
            <br>
        </form>

    </div>

    <!-- script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const categorySelect = document.getElementById("categorySelect");
            const newCategoryBox = document.getElementById("newCategoryBox");
            const newCategoryName = document.getElementById("newCategoryName");
            const addCategoryBtn = document.getElementById("addCategoryBtn");
            const cancelCategoryBtn = document.getElementById("cancelCategoryBtn");
            const categoryMessage = document.getElementById("categoryMessage");

            // Show add-category box
            categorySelect.addEventListener("change", function () {

                if (this.value === "__add_category__") {

                    newCategoryBox.style.display = "block";
                    newCategoryName.focus();

                } else {

                    newCategoryBox.style.display = "none";
                    categoryMessage.textContent = "";
                }
            });


            // Cancel adding category
            cancelCategoryBtn.addEventListener("click", function () {

                newCategoryBox.style.display = "none";
                newCategoryName.value = "";
                categoryMessage.textContent = "";

                categorySelect.value = "";
            });


            // Add category
            addCategoryBtn.addEventListener("click", function () {

                const name = newCategoryName.value.trim();

                if (!name) {

                    categoryMessage.textContent =
                        "Please enter a category name.";

                    return;
                }


                addCategoryBtn.disabled = true;
                addCategoryBtn.textContent = "Adding...";


                // Get CSRF token
                const csrfToken = document.querySelector(
                    "[name=csrfmiddlewaretoken]"
                ).value;


                const formData = new FormData();

                formData.append("name", name);


                fetch("{% url 'quizapp:add_category' %}", {

                    method: "POST",

                    headers: {
                        "X-CSRFToken": csrfToken
                    },

                    body: formData

                })

                    .then(response => response.json())

                    .then(data => {

                        if (data.success) {

                            /*
                             * Remove the temporary Add New Category option
                             * before adding the new category.
                             */
                            const addOption =
                                categorySelect.querySelector(
                                    'option[value="__add_category__"]'
                                );


                            const newOption =
                                document.createElement("option");

                            newOption.value = data.id;
                            newOption.textContent = data.name;


                            categorySelect.insertBefore(
                                newOption,
                                addOption
                            );


                            // Select newly created category
                            categorySelect.value = data.id;


                            // Reset UI
                            newCategoryName.value = "";
                            newCategoryBox.style.display = "none";
                            categoryMessage.textContent = "";


                            if (data.existing) {

                                console.log(
                                    "Category already existed. Selected existing category."
                                );

                            }

                        } else {

                            categoryMessage.textContent =
                                data.error || "Unable to add category.";
                        }

                    })

                    .catch(error => {

                        console.error(error);

                        categoryMessage.textContent =
                            "Something went wrong. Please try again.";

                    })

                    .finally(() => {

                        addCategoryBtn.disabled = false;
                        addCategoryBtn.textContent = "Add Category";

                    });

            });

        });
    </script>

</body>

</html>
