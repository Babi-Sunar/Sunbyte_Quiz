{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Question</title>

    <link rel="stylesheet" href="{% static 'quizapp/css/delete_question.css' %}">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Delete Question</h1>

            <p class="warning">
                Are you sure you want to permanently delete this question?
            </p>

            <div class="question-box">

                <h3>Question</h3>

                <p>
                    {{ question.text }}
                </p>

            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="button-group">

                    <button type="submit" class="delete-btn">
                        🗑 Delete
                    </button>

                    <a href="{% url 'quizapp:manage_session' session.code %}" class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
