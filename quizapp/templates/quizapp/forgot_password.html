{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Forgot Password | SunByte Quiz</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;

        background: linear-gradient(
            135deg,
            #117373 0%,
            #155e75 45%,
            #003467 100%
        );
    }

    .forgot-container {
        width: 100%;
        max-width: 430px;
    }

    .forgot-card {
        background: rgba(255, 255, 255, 0.97);
        border-radius: 22px;
        padding: 35px 28px;
        text-align: center;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .logo {
        font-size: 34px;
        font-weight: 800;
        color: #117373;
        text-shadow:
            rgba(0,0,0,.16) 0 3px 6px,
            rgba(0,0,0,.23) 0 3px 6px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #555;
        font-size: 14px;
        margin-bottom: 28px;
        line-height: 1.6;
    }

    h2 {
        color: #222;
        font-size: 25px;
        margin-bottom: 10px;
    }

    .description {
        color: #666;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .form-group {
        text-align: left;
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-size: 14px;
        font-weight: 600;
    }

    .form-input {
        width: 100%;
        padding: 14px 15px;

        border: 1px solid #ccc;
        border-radius: 10px;

        outline: none;
        font-size: 15px;

        transition: 0.25s ease;
    }

    .form-input:focus {
        border-color: #117373;
        box-shadow: 0 0 0 3px rgba(17, 115, 115, 0.12);
    }

    .reset-btn {
        width: 100%;
        border: none;
        border-radius: 10px;

        padding: 14px;
        margin-top: 5px;

        background: #FFC300;
        color: #111;

        font-size: 16px;
        font-weight: 700;

        cursor: pointer;

        box-shadow:
            rgba(0,0,0,.16) 0 3px 6px,
            rgba(0,0,0,.23) 0 3px 6px;

        transition: 0.25s ease;
    }

    .reset-btn:hover {
        transform: translateY(-2px);
        background: #ffca18;
    }

    .back-login {
        display: inline-block;
        margin-top: 22px;

        color: #003467;
        text-decoration: none;

        font-size: 14px;
        font-weight: 600;
    }

    .back-login:hover {
        text-decoration: underline;
    }

    .message {
        margin-bottom: 18px;
        padding: 11px 14px;
        border-radius: 9px;

        background: #fff3cd;
        color: #664d03;

        font-size: 13px;
    }

    @media (max-width: 480px) {
        body {
            padding: 15px;
        }

        .forgot-card {
            padding: 30px 20px;
            border-radius: 18px;
        }

        .logo {
            font-size: 30px;
        }

        h2 {
            font-size: 22px;
        }
    }
</style>


</head>

<body>

<div class="forgot-container">


<div class="forgot-card">

    <div class="logo">SunByte Quiz</div>

    <h2>Forgot Password?</h2>

    <p class="subtitle">
        No worries! Enter your registered email address
        and we'll send you a password reset link.
    </p>


    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="Enter your email"
                required
                autocomplete="email"
            >

        </div>

        <button type="submit" class="reset-btn">
            Send Reset Link
        </button>

    </form>

    <a href="{% url 'quizapp:login' %}" class="back-login">
        ← Back to Login
    </a>

</div>


</div>

</body>
</html>
