{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'quizapp/css/login.css' %}">

    <title>Login</title>
</head>

<body>

    <h2>Login</h2>
    <div id="loginAlert" class="login-alert"></div>
    <a href="{% url 'quizapp:home' %}" class="back-btn" style="color: #4a4638;position: relative ; left: 60vw;">
        ← Home
    </a>
    <form id="loginForm" method="post">
        {% csrf_token %}

        <div id="input-section">

            <!-- Email -->
            <label id="email-label" for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="E-mail here..." required><br>

            <!-- Password -->
            <label id="password-label" for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password here..."
                autocomplete="current-password" required><br>

            <!-- Remember Me -->
            <div>
                <input type="checkbox" id="remember" name="remember">
                <label id="remember-label" for="remember">Remember Me</label>
            </div><br>

            <!-- Login Button -->
            <div id="login-btn-container">
                <button id="login-btn" type="submit">Login</button><br><br>
            </div>

        </div>

        <br><br>

        <div id="login-options">

            <a href="{% url 'quizapp:forgot_password' %}" style="color:#003467c6;
          text-shadow:rgba(0,0,0,.16) 0px 3px 6px,
                      rgba(0,0,0,.23) 0px 3px 6px;">
                Forgot Password?
            </a>
            <br>

            <!-- Signup -->
            <p style="color:rgb(236,206,172);text-shadow:rgba(0,0,0,.16) 0px 3px 6px, rgba(0,0,0,.23) 0px 3px 6px;">
                Don't have an account?
                <a href="{% url 'quizapp:signup' %}"
                    style="color:#cc9d04;text-shadow:rgba(0,0,0,.16) 0px 3px 6px, rgba(0,0,0,.23) 0px 3px 6px;">
                    Sign Up
                </a>
            </p>

        </div>

    </form>

    <!-- JavaScript -->
    <!-- <script src="{% static 'quizapp/js/login.js' %}"></script> -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const form = document.querySelector("form");
            const emailInput = document.querySelector('input[name="email"]');
            const passwordInput = document.querySelector('input[name="password"]');
            const alertBox = document.getElementById("loginAlert");

            function showAlert(message, type = "error") {

                if (!alertBox) return;

                alertBox.textContent = message;

                alertBox.className = "login-alert " + type;

                alertBox.style.display = "block";

                setTimeout(() => {
                    alertBox.style.opacity = "0";

                    setTimeout(() => {
                        alertBox.style.display = "none";
                        alertBox.style.opacity = "1";
                    }, 300);

                }, 4000);
            }


            if (form) {

                form.addEventListener("submit", function (event) {

                    const email = emailInput
                        ? emailInput.value.trim()
                        : "";

                    const password = passwordInput
                        ? passwordInput.value
                        : "";


                    /* -----------------------------
                       Empty email
                    ----------------------------- */

                    if (!email) {

                        event.preventDefault();

                        showAlert(
                            "Please enter your email address."
                        );

                        if (emailInput) {
                            emailInput.focus();
                        }

                        return;
                    }


                    /* -----------------------------
                       Email format
                    ----------------------------- */

                    const emailPattern =
                        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                    if (!emailPattern.test(email)) {

                        event.preventDefault();

                        showAlert(
                            "Please enter a valid email address."
                        );

                        if (emailInput) {
                            emailInput.focus();
                        }

                        return;
                    }


                    /* -----------------------------
                       Empty password
                    ----------------------------- */

                    if (!password) {

                        event.preventDefault();

                        showAlert(
                            "Please enter your password."
                        );

                        if (passwordInput) {
                            passwordInput.focus();
                        }

                        return;
                    }

                });
            }


            /* ------------------------------------
               Django messages
               ------------------------------------ */

            const djangoMessages =
                document.querySelectorAll(".messages li");

            djangoMessages.forEach(function (message) {

                const text = message.textContent.trim();

                if (!text) return;

                let type = "error";

                if (
                    text.toLowerCase().includes("success")
                ) {
                    type = "success";
                }

                showAlert(text, type);
            });

        });
    </script>
</body>

</html>
